[package]
name = "photo-importer"
version = "0.1.0"
description = "Safe, automated photo import and backup"
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photo_importer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
importer-domain = { path = "../crates/importer-domain" }
importer-background = { path = "../crates/importer-background" }
importer-import = { path = "../crates/importer-import" }
importer-manifest = { path = "../crates/importer-manifest" }
importer-media = { path = "../crates/importer-media" }
importer-plan = { path = "../crates/importer-plan" }
importer-settings = { path = "../crates/importer-settings" }
importer-thumbnails = { path = "../crates/importer-thumbnails" }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
image.workspace = true
